<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시나리오 시뮬레이션</title>
<style>
:root {
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s8:#e34948;
  --ord1:#86b6ef; --ord2:#2a78d6; --ord3:#184f95;
  --good:#006300; --crit:#d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1:#1a1a19; --plane:#0d0d0d;
    --ink-1:#f0efec; --ink-2:#c3c2b7; --ink-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s8:#e66767;
    --ord1:#6da7ec; --ord2:#3987e5; --ord3:#184f95;
    --good:#0ca30c; --crit:#d03b3b;
  }
}
* { box-sizing:border-box; margin:0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background:var(--plane); color:var(--ink-1); line-height:1.55; padding:24px 16px 80px;
}
.wrap { max-width:1060px; margin:0 auto; }
header h1 { font-size:26px; letter-spacing:-0.5px; }
header .sub { color:var(--ink-2); margin-top:6px; font-size:14.5px; }
.badges { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.badge { font-size:11.5px; color:var(--ink-2); border:1px solid var(--border); background:var(--surface-1); padding:3px 10px; border-radius:99px; }
.flow { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:22px 0 4px; font-size:13px; color:var(--ink-2); }
.flow b { color:var(--ink-1); }
.flow .arr { color:var(--ink-muted); }
.card { background:var(--surface-1); border:1px solid var(--border); border-radius:14px; padding:20px 22px; margin-top:18px; }
.stageTag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--ink-muted); text-transform:uppercase; }
.card h2 { font-size:19px; margin-top:2px; }
.card .desc { color:var(--ink-2); font-size:13.5px; margin-top:4px; }
.tabs { display:flex; gap:6px; margin:14px 0 10px; flex-wrap:wrap; }
.tab { border:1px solid var(--border); background:transparent; color:var(--ink-2); font:inherit; font-size:13px; padding:5px 14px; border-radius:99px; cursor:pointer; }
.tab.on { background:var(--ink-1); color:var(--plane); border-color:var(--ink-1); }
.row { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
.col { flex:1 1 340px; min-width:300px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-top:12px; }
.stat { border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.stat .k { font-size:11.5px; color:var(--ink-muted); }
.stat .v { font-size:19px; font-weight:650; margin-top:2px; }
.stat .v small { font-size:12px; font-weight:400; color:var(--ink-2); }
.sliderRow { margin-top:14px; }
.sliderRow label { font-size:13px; color:var(--ink-2); display:flex; justify-content:space-between; }
.sliderRow label b { color:var(--ink-1); }
input[type=range] { width:100%; accent-color:var(--s1); }
.toggleRow { display:flex; align-items:center; gap:10px; margin-top:14px; font-size:14px; }
.switch { position:relative; width:44px; height:24px; flex:none; }
.switch input { opacity:0; width:0; height:0; }
.knob { position:absolute; inset:0; background:var(--axis); border-radius:99px; transition:.15s; cursor:pointer; }
.knob::before { content:""; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.15s; }
.switch input:checked + .knob { background:var(--s3); }
.switch input:checked + .knob::before { transform:translateX(20px); }
.alert { border-radius:10px; padding:10px 14px; font-size:13.5px; margin-top:12px; border:1px solid var(--border); }
.alert.bad { border-color:var(--crit); color:var(--crit); }
.alert.good { border-color:var(--good); color:var(--good); }
svg { display:block; width:100%; height:auto; }
svg text { font-family:inherit; }
.legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:12px; color:var(--ink-2); }
.legend .sw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chip { font-size:12px; border:1px solid var(--border); border-radius:8px; padding:3px 9px; color:var(--ink-2); }
.chip b { color:var(--ink-1); }
.hero { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:14px; }
.hero .h { border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
.hero .h .k { font-size:12px; color:var(--ink-muted); }
.hero .h .v { font-size:26px; font-weight:700; margin-top:4px; }
.hero .h .d { font-size:12px; color:var(--ink-2); margin-top:3px; }
#tip { position:fixed; pointer-events:none; background:var(--ink-1); color:var(--plane);
  font-size:12px; padding:5px 9px; border-radius:7px; opacity:0; transition:opacity .1s; z-index:9; max-width:240px; }
footer { margin-top:28px; font-size:11.5px; color:var(--ink-muted); line-height:1.7; }
table.mini { border-collapse:collapse; font-size:12.5px; margin-top:10px; width:100%; }
table.mini th, table.mini td { border:1px solid var(--grid); padding:4px 8px; text-align:right; }
table.mini th:first-child, table.mini td:first-child { text-align:left; }
table.mini th { color:var(--ink-2); font-weight:600; background:transparent; }
.nav { display:flex; gap:6px; margin-bottom:14px; }
.nav a { font-size:12.5px; color:var(--ink-2); text-decoration:none; border:1px solid var(--border); padding:4px 12px; border-radius:99px; }
.nav a.on { background:var(--ink-1); color:var(--plane); border-color:var(--ink-1); }
.note { font-size:12px; color:var(--ink-muted); margin-top:8px; }
.controls { position:sticky; top:0; z-index:5; background:var(--plane); padding:12px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--border); margin-top:14px; }
.btn { font:inherit; font-size:14px; padding:8px 16px; border-radius:10px; border:1px solid var(--border); background:var(--surface-1); color:var(--ink-1); cursor:pointer; }
.btn.primary { background:var(--ink-1); color:var(--plane); border-color:var(--ink-1); font-weight:600; }
.btn:disabled { opacity:.4; cursor:default; }
.cycBadge { margin-left:auto; font-size:13px; color:var(--ink-2); }
.cycBadge b { color:var(--ink-1); font-size:16px; }
.pipe { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px; }
.pbox { border:1px solid var(--border); border-radius:12px; padding:12px 14px; background:var(--surface-1); transition:box-shadow .25s, border-color .25s; position:relative; }
.pbox .k { font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--ink-muted); }
.pbox .v { font-size:22px; font-weight:700; margin-top:2px; }
.pbox .d { font-size:12px; color:var(--ink-2); }
.pbox.act { border-color:var(--s2); box-shadow:0 0 0 3px color-mix(in srgb, var(--s2) 25%, transparent); }
.pbox:not(:last-child)::after { content:"→"; position:absolute; right:-10px; top:50%; transform:translateY(-50%); color:var(--ink-muted); font-size:14px; }
.heat { border-collapse:separate; border-spacing:3px; width:100%; font-size:12.5px; margin-top:8px; }
.heat th { font-weight:600; color:var(--ink-2); font-size:12px; padding:2px 4px; }
.heat td { text-align:center; padding:7px 4px; border-radius:6px; transition:background-color .5s; position:relative; font-variant-numeric:tabular-nums; }
.heat td.zero { color:var(--crit); font-weight:700; }
.heat td.lb { outline:2px solid var(--s2); outline-offset:-2px; }
.heat td.flash { animation:flash 1.1s ease-out; }
@keyframes flash { 0% { box-shadow:0 0 0 4px var(--s2); } 100% { box-shadow:0 0 0 0 transparent; } }
.log { max-height:300px; overflow:auto; margin-top:8px; font-size:13px; }
.log .e { padding:7px 10px; border-left:3px solid var(--s2); background:var(--surface-1); border-radius:0 8px 8px 0; margin-bottom:6px; }
.log .e.c { border-left-color:var(--s3); }
.log .e .t { font-size:11px; color:var(--ink-muted); font-weight:700; }
.presets { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px 22px; }
@media (max-width:760px) { .pipe { grid-template-columns:1fr 1fr; } .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
<div class="nav"><a class="on" href="index.html">시나리오 시뮬레이션</a><a href="mc.html">불확실성 시뮬레이션</a></div>
<header>
  <h1>시나리오 시뮬레이션</h1>
</header>

<section class="card">
  <div class="presets" id="presets" style="margin-top:0"></div>
  <details style="margin-top:10px"><summary style="cursor:pointer;font-size:13px;color:var(--ink-2)">직접 조정</summary>
  <div class="grid2" style="margin-top:6px">
    <div>
      <div class="sliderRow"><label>비규격 발생률 <b id="l_ns"></b></label><input type="range" id="ns" min="10" max="20" step="1"></div>
      <div class="sliderRow"><label>확보율 <b id="l_aq"></b></label><input type="range" id="aq" min="5" max="30" step="1"></div>
      <div class="sliderRow"><label>수도권 지원 대상 변화 <b id="l_dm"></b></label><input type="range" id="dm" min="-20" max="50" step="5"></div>
    </div>
    <div id="shockSliders"></div>
  </div></details>
  <div id="presetDesc" style="display:none"></div>
</section>

<div class="controls">
  <button class="btn primary" id="bStep">▶ 다음</button>
  <button class="btn" id="bAuto">⏩ 자동</button>
  <button class="btn" id="bReset">↺ 초기화</button>
  <div class="cycBadge" id="cycBadge"></div>
</div>

<div class="pipe">
  <div class="pbox" id="p1"><div class="k">STAGE 1 · 확보</div><div class="v" id="p1v">–</div><div class="d" id="p1d"></div></div>
  <div class="pbox" id="p2"><div class="k">STAGE 2 · 배분</div><div class="v" id="p2v">–</div><div class="d" id="p2d"></div></div>
  <div class="pbox" id="p3"><div class="k">STAGE 3 · 영양</div><div class="v" id="p3v">–</div><div class="d" id="p3d"></div></div>
  <div class="pbox" id="p4"><div class="k">피드백 ⟲</div><div class="v" id="p4v">–</div><div class="d" id="p4d"></div></div>
</div>

<div class="row">
  <section class="card col">
    <span class="stageTag">Stage 1</span><h2>확보 물량 (톤)</h2>
    <div id="s1"></div>
  </section>
  <section class="card col">
    <span class="stageTag">Stage 2</span><h2>배분 (톤)</h2>
    <div class="legend"><span><b style="color:var(--crit)">0</b> 미배분</span><span><span class="sw" style="background:transparent;outline:2px solid var(--s2)"></span>피드백 적용</span></div>
    <div id="s2"></div>
  </section>
</div>

<section class="card">
  <span class="stageTag">Stage 3</span><h2>영양 충족률 (%)</h2><b id="baseDri" style="display:none"></b>
  <div id="s3"></div>
</section>

<div class="row">
  <section class="card col">
    <span class="stageTag">수렴</span><h2>평균 충족률</h2>
    <div id="cvDri"></div>
  </section>
  <section class="card col">
    <span class="stageTag">수렴</span><h2>물류 부하 (M 톤·km)</h2>
    <div id="cvCost"></div>
  </section>
</div>

<div class="row">
  <section class="card col">
    <span class="stageTag">피드백</span><h2>감지 → 조치</h2>
    <div class="log" id="log"></div>
  </section>
  <section class="card col">
    <span class="stageTag">→ Stage 1</span><h2>다음 시즌 확보 우선순위</h2>
    <div id="sig"></div>
    <div id="newItem"></div>
  </section>
</div>
<div id="tip"></div>
</div>

<script src="compute.js"></script>
<script src="cycle.js"></script>
<script>
const $ = s => document.querySelector(s);
const fmt = v => Math.round(v).toLocaleString("ko-KR");
const ITEM_COLOR = { "쌀":"var(--s4)", "양파":"var(--s2)", "가을배추":"var(--s3)", "사과":"var(--s8)" };
const tip = $("#tip");
function bindTips(root){ root.querySelectorAll("[data-tip]").forEach(el=>{
  el.addEventListener("mousemove",e=>{ tip.textContent=el.dataset.tip; tip.style.left=Math.min(e.clientX+12,innerWidth-250)+"px"; tip.style.top=(e.clientY+14)+"px"; tip.style.opacity=1; });
  el.addEventListener("mouseleave",()=>tip.style.opacity=0); }); }

let P = JSON.parse(JSON.stringify(SCENARIOS.base)), curKey = "base", sim, basePools, logs = [], autoT = null, prevAlloc = null;
basePools = newSim(SCENARIOS.base).pools;

// ---------- 입력 UI ----------
Object.entries(SCENARIOS).forEach(([k,s]) => {
  const b = document.createElement("button"); b.className = "tab"; b.textContent = s.name; b.dataset.k = k;
  b.onclick = () => { curKey = k; P = JSON.parse(JSON.stringify(s)); syncInputs(); reset(); };
  $("#presets").appendChild(b);
});
DATA.items.forEach(it => {
  $("#shockSliders").insertAdjacentHTML("beforeend",
    `<div class="sliderRow"><label>${it} 생산 충격 <b id="l_sh_${it}"></b></label><input type="range" id="sh_${it}" min="-40" max="40" step="5"></div>`);
});
function syncInputs(){
  $("#ns").value = P.ns; $("#aq").value = P.aq; $("#dm").value = P.demand;
  DATA.items.forEach(it => $("#sh_"+it).value = P.shock[it]);
  labels();
  document.querySelectorAll("#presets .tab").forEach(t => t.classList.toggle("on", t.dataset.k === curKey));
  $("#presetDesc").textContent = curKey === "custom" ? "직접 설정한 조건" : SCENARIOS[curKey].desc;
}
function labels(){
  $("#l_ns").textContent = P.ns + "%"; $("#l_aq").textContent = P.aq + "%";
  $("#l_dm").textContent = (P.demand > 0 ? "+" : "") + P.demand + "%";
  DATA.items.forEach(it => $("#l_sh_"+it).textContent = (P.shock[it] > 0 ? "+" : "") + P.shock[it] + "%");
}
function onInput(){
  P.ns = +$("#ns").value; P.aq = +$("#aq").value; P.demand = +$("#dm").value;
  DATA.items.forEach(it => P.shock[it] = +$("#sh_"+it).value);
  curKey = "custom"; syncInputs(); reset();
}
["ns","aq","dm"].concat(DATA.items.map(it=>"sh_"+it)).forEach(id => $("#"+id).addEventListener("change", onInput));
["ns","aq","dm"].concat(DATA.items.map(it=>"sh_"+it)).forEach(id => $("#"+id).addEventListener("input", () => {
  P.ns = +$("#ns").value; P.aq = +$("#aq").value; P.demand = +$("#dm").value;
  DATA.items.forEach(it => P.shock[it] = +$("#sh_"+it).value); labels(); }));

// ---------- 실행 ----------
function reset(){
  stopAuto(); sim = newSim(P); logs = []; prevAlloc = null;
  $("#baseDri").textContent = sim.base.toFixed(1) + "%";
  renderAll(null);
}
function step(){
  if (sim.done) return;
  const c = runCycle(sim);
  const msgs = c.actions.map(a => `${a.zone} · ${a.nutrient} <b style="color:var(--crit)">${a.level.toFixed(0)}%</b> → <b>${a.item}</b> ↑`);
  logs.unshift({ n:c.n, html: `<b>${c.dri.toFixed(1)}%</b>${c.gain!=null?` <span style="color:var(--ink-muted)">(${c.gain>=0?"+":""}${c.gain.toFixed(1)}%p)</span>`:""}` +
    (msgs.length ? "<br>" + msgs.join("<br>") : ""), conv: !!c.reason, reason: c.reason ? "수렴" : "" });
  pulse(); renderAll(c);
}
function pulse(){
  ["p1","p2","p3","p4"].forEach((id,i) => { setTimeout(() => $("#"+id).classList.add("act"), i*220); setTimeout(() => $("#"+id).classList.remove("act"), i*220 + 600); });
}
function stopAuto(){ if (autoT) { clearInterval(autoT); autoT = null; } $("#bAuto").textContent = "⏩ 자동"; }
$("#bStep").onclick = () => { stopAuto(); step(); };
$("#bReset").onclick = reset;
$("#bAuto").onclick = () => {
  if (autoT) { stopAuto(); return; }
  $("#bAuto").textContent = "⏸ 멈춤"; step();
  autoT = setInterval(() => { if (sim.done) { stopAuto(); return; } step(); }, 1300);
};

// ---------- 렌더 ----------
function renderAll(c){
  const tot = Object.values(sim.pools).reduce((a,v)=>a+v,0);
  $("#p1v").textContent = fmt(tot) + "t";
  $("#p1d").textContent = `${fmt(sim.N.reduce((a,v)=>a+v,0))}명`;
  if (!c) {
    ["p2v","p3v","p4v"].forEach(id => $("#"+id).textContent = "–");
    $("#p2d").textContent = "▶ 다음"; $("#p3d").textContent = ""; $("#p4d").textContent = "";
  } else {
    const sav = (1 - c.S2.cost / c.S2.naive) * 100;
    $("#p2v").textContent = (c.S2.cost/1e6).toFixed(2) + "M";
    $("#p2d").textContent = `톤·km · −${sav.toFixed(1)}% · 0톤 ${c.zeros}칸`;
    $("#p3v").textContent = c.dri.toFixed(1) + "%";
    $("#p3d").textContent = `현행 ${sim.base.toFixed(1)}% · 최저 ${c.minReg.toFixed(1)}%`;
    $("#p4v").textContent = c.reason ? "수렴" : c.actions.length + "건";
    $("#p4d").textContent = c.reason ? "" : "배분 제약 추가";
  }
  $("#cycBadge").innerHTML = c ? `사이클 <b>${c.n}</b>${sim.done ? " · <span style='color:var(--good);font-weight:700'>수렴</span>" : ""}` : "사이클 <b>0</b>";
  $("#bStep").disabled = sim.done; $("#bAuto").disabled = sim.done && !autoT;
  renderS1(); renderS2(c); renderS3(c); renderConv(); renderLog(); renderSig(c);
  bindTips(document.body);
}

function renderS1(){
  const W = 460, H = 200, mx = Math.max(...DATA.items.map(it => Math.max(sim.pools[it], basePools[it]))) * 1.15;
  const bw = (W - 40) / 4;
  let g = "";
  DATA.items.forEach((it,i) => {
    const x = 30 + i*bw, hb = basePools[it]/mx*(H-50), hc = sim.pools[it]/mx*(H-50);
    g += `<rect x="${x+bw*0.18}" y="${H-28-hb}" width="${bw*0.28}" height="${hb}" rx="3" fill="var(--axis)" data-tip="기본 ${it}: ${fmt(basePools[it])}톤"/>`;
    g += `<rect x="${x+bw*0.5}" y="${H-28-hc}" width="${bw*0.32}" height="${hc}" rx="3" fill="${ITEM_COLOR[it]}" data-tip="현재 ${it}: ${fmt(sim.pools[it])}톤"/>`;
    g += `<text x="${x+bw*0.66}" y="${H-33-hc}" text-anchor="middle" font-size="11" fill="var(--ink-1)" font-weight="600">${fmt(sim.pools[it])}</text>`;
    g += `<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--ink-2)">${it}</text>`;
  });
  g += `<line x1="24" x2="${W-6}" y1="${H-28}" y2="${H-28}" stroke="var(--axis)"/>`;
  $("#s1").innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function renderS2(c){
  if (!c) { $("#s2").innerHTML = `<div class="note" style="margin-top:14px">–</div>`; prevAlloc = null; return; }
  const A = c.S2.alloc, mx = Math.max(...A.flat());
  let h = `<table class="heat"><tr><th></th>${DATA.zones.map(z=>`<th>${z}</th>`).join("")}</tr>`;
  DATA.items.forEach((it,i) => {
    h += `<tr><th style="text-align:left">${it}</th>`;
    DATA.zones.forEach((z,k) => {
      const v = A[i][k], lb = c.L[i][k] > 0, chg = prevAlloc && Math.abs(prevAlloc[i][k] - v) > 50;
      const bg = v < 1 ? "transparent" : `color-mix(in srgb, ${ITEM_COLOR[it]} ${Math.round(15 + 70*v/mx)}%, transparent)`;
      h += `<td class="${v<1?"zero":""} ${lb?"lb":""} ${chg?"flash":""}" style="background:${bg}"
            data-tip="${z} · ${it}: ${fmt(v)}톤${lb?` (피드백 하한 ${fmt(c.L[i][k])}톤)`:""}">${v<1?"0":fmt(v)}</td>`;
    });
    h += `</tr>`;
  });
  h += `</table>`;
  $("#s2").innerHTML = h; prevAlloc = A.map(r=>r.slice());
}

function renderS3(c){
  if (!c) { $("#s3").innerHTML = `<div class="note" style="margin-top:14px">–</div>`; return; }
  let h = `<table class="heat"><tr><th></th>${DATA.nutrientsKr.map(n=>`<th>${n}</th>`).join("")}<th>평균</th></tr>`;
  c.S3.forEach(r => {
    h += `<tr><th style="text-align:left">${r.zone}</th>`;
    r.z.forEach((v,n) => {
      const low = v < 50;
      h += `<td style="background:color-mix(in srgb, var(--s1) ${Math.round(8 + 62*v/100)}%, transparent);${low?"color:var(--crit);font-weight:700":""}"
            data-tip="${r.zone} · ${DATA.nutrientsKr[n]}: ${v.toFixed(1)}%">${v.toFixed(0)}</td>`;
    });
    h += `<td style="font-weight:700">${r.score.toFixed(1)}</td></tr>`;
  });
  h += `</table>`;
  $("#s3").innerHTML = h;
}

function lineChart(vals, ref, refLab, unit, color, dec){
  const W = 460, H = 200, n = Math.max(vals.length, 6);
  if (!vals.length) return `<div class="note" style="margin-top:14px">–</div>`;
  const all = vals.concat(ref != null ? [ref] : []);
  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * 0.2 || 1; lo -= pad; hi += pad;
  const sx = i => 40 + i * (W - 60) / (n - 1), sy = v => H - 28 - (v - lo) / (hi - lo) * (H - 50);
  let g = "";
  for (let t = 0; t <= 3; t++) { const v = lo + (hi - lo) * t / 3;
    g += `<line x1="36" x2="${W-10}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)"/><text x="32" y="${sy(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-muted)">${v.toFixed(dec)}</text>`; }
  if (ref != null) g += `<line x1="36" x2="${W-10}" y1="${sy(ref)}" y2="${sy(ref)}" stroke="var(--ink-muted)" stroke-dasharray="4 4"/><text x="${W-12}" y="${sy(ref)-5}" text-anchor="end" font-size="10.5" fill="var(--ink-2)">${refLab}</text>`;
  g += `<polyline fill="none" stroke="${color}" stroke-width="2" points="${vals.map((v,i)=>`${sx(i)},${sy(v)}`).join(" ")}"/>`;
  vals.forEach((v,i) => { g += `<circle cx="${sx(i)}" cy="${sy(v)}" r="5" fill="${color}" stroke="var(--surface-1)" stroke-width="2" data-tip="사이클 ${i+1}: ${v.toFixed(dec)}${unit}"/>`; });
  const last = vals.length - 1;
  g += `<text x="${sx(last)}" y="${sy(vals[last])-10}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink-1)">${vals[last].toFixed(dec)}${unit}</text>`;
  for (let i = 0; i < n; i++) g += `<text x="${sx(i)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--ink-muted)">${i+1}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function renderConv(){
  $("#cvDri").innerHTML = lineChart(sim.cycles.map(c=>c.dri), sim.base, `현행 ${sim.base.toFixed(1)}%`, "%", "var(--s3)", 1);
  const naive = sim.cycles.length ? sim.cycles[0].S2.naive/1e6 : null;
  $("#cvCost").innerHTML = lineChart(sim.cycles.map(c=>c.S2.cost/1e6), naive, `비례배분 ${naive?naive.toFixed(2):""}`, "M", "var(--s1)", 2);
}
function renderLog(){
  $("#log").innerHTML = logs.length ? logs.map(l =>
    `<div class="e ${l.conv?"c":""}"><div class="t">사이클 ${l.n}${l.conv?" · 수렴":""}</div>${l.html}${l.reason?`<br><b style="color:var(--good)">${l.reason}</b>`:""}</div>`).join("")
    : `<div class="note">–</div>`;
}
function renderSig(c){
  if (!c) { $("#sig").innerHTML = ""; $("#newItem").innerHTML = ""; return; }
  const W = 460, H = 150, bw = (W - 110);
  let g = "";
  DATA.items.forEach((it,i) => {
    const v = c.signal[it], y = 10 + i*34;
    g += `<text x="0" y="${y+16}" font-size="12" fill="var(--ink-2)">${it}</text>`;
    g += `<rect x="70" y="${y+3}" width="${Math.max(v*bw,2)}" height="18" rx="4" fill="${ITEM_COLOR[it]}" data-tip="${it}: 상대 확보 우선순위 ${(v*100).toFixed(0)}"/>`;
    g += `<text x="${76+v*bw}" y="${y+16}" font-size="11.5" font-weight="600" fill="var(--ink-1)">${(v*100).toFixed(0)}</text>`;
  });
  $("#sig").innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  const ni = Object.entries(sim.signals).filter(([n,s]) => n === "칼슘" || s.size >= 3);
  $("#newItem").innerHTML = ni.length ? `<div class="alert bad"><b>${ni.map(([n])=>n).join(", ")}</b> → 신규 품목 필요 (유제품·두류)</div>` : "";
}

syncInputs(); reset();
// URL로 바로 시연: cycle.html?s=cabbage&run=3  (발표 캡처용)
{ const q = new URLSearchParams(location.search);
  if (q.get("s") && SCENARIOS[q.get("s")]) { curKey = q.get("s"); P = JSON.parse(JSON.stringify(SCENARIOS[curKey])); syncInputs(); reset(); }
  const n = +(q.get("run") || 0); for (let i = 0; i < n && !sim.done; i++) step(); }
